{% extends "base.html" %}
{% block content %}
<h2>Регистрация</h2>
<form method="post">
    {% csrf_token %}
    <p><input type="text" name="username" placeholder="Логин" required></p>
    <p><input type="password" name="password" placeholder="Пароль (минимум 8 символов)" required></p>
    <p><input type="text" name="full_name" placeholder="ФИО" required></p>
    <p><input type="text" name="phone" placeholder="Телефон (8(XXX)XXX-XX-XX)" required></p>
    <p><input type="email" name="email" placeholder="Почта" required></p>
    <button type="submit">Зарегистрироваться</button>
</form>
{% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
<p>Войти в аккаунт <a class="button" href="{% url 'login' %}">Войти</a></p>
{% endblock content %}
